name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 检查 Bash 语法
        run: bash -n init_setup.sh

      - name: 运行 ShellCheck
        run: shellcheck init_setup.sh

      - name: 运行回归测试
        run: python3 -m unittest discover -s tests -v
